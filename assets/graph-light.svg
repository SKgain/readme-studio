<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="gt gd">
  <title id="gt">README Studio as a graph</title>
  <desc id="gd">README Studio reads profile.json; README Studio generates Hero; README Studio generates Stack panel; README Studio generates Graph; README Studio generates Buttons; Hero embedded in README.md; Stack panel embedded in README.md; Graph embedded in README.md; Buttons embedded in README.md; preview.py checks README.md.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C959F"/></marker>
  </defs>
  <style>
    .bar { fill: #F6F8FA; }
    .rule { stroke: #D0D7DE; stroke-width: 1.5; }
    .q { font: 500 14px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; fill: #1F2328; }
    .kw { fill: #2F7D1F; }
    .edge { stroke: #8C959F; stroke-width: 1.5; fill: none; }
    .rel { font: 500 9.5px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; fill: #59636E; }
    .relbg { fill: #FFFFFF; }
    .cap { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .cap-big { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .legend { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #59636E; }
    .ring { fill: none; stroke: #2F7D1F; stroke-width: 2; }
    .node { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,.8,.3,1.2) both; }
    .link { animation: fade .5s ease-out both; }
    .edge.draw { stroke-dasharray: 1; animation: draw .6s ease-out both; }
    .ring { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-out 2.4s infinite both; }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(1.45); } }
    @media (prefers-reduced-motion: reduce) { .node, .link, .edge.draw, .ring { animation: none; } .ring { opacity: 0; } }
  </style>
