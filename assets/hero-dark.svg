<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">README Studio</title>
  <desc id="d">README Studio. A Claude skill that designs animated GitHub READMEs. An event travels through Your facts, generate, preview, GitHub. Now: Saikat Kumar Gain, Backend engineer, Dhaka.</desc>
  <style>
    .panel { fill: #0D1117; stroke: #30363D; }
    .name { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .role { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .code { font: 500 15px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; fill: #6DB33F; }
    .card { fill: #161B22; stroke: #30363D; }
    .k { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .v { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #E6EDF3; }
    .lnk { font: 500 13px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; fill: #6DB33F; }
    .wire { stroke: #30363D; stroke-width: 2; }
    .node { fill: #161B22; stroke: #30363D; stroke-width: 1.5; }
    .glow { fill: #1A281D; stroke: #6DB33F; stroke-width: 1.5; opacity: 0; }
    .label { font: 500 14px ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; fill: #E6EDF3; }
    .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .event { fill: #6DB33F; }
    .cursor { fill: #6DB33F; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .ev { animation: travel 6.8s linear infinite both; }
    .trail { animation-delay: .07s; opacity: .45; }
    @keyframes travel { 0% { transform: translateX(0); } 84%, 100% { transform: translateX(660px); } }
    .g0 { animation: glow0 6.8s ease-out infinite both; }
    @keyframes glow0 { 0%, 0.0% { opacity: 1; } 0.0% { opacity: 1; } 9.0%, 100% { opacity: 0; } }
    .g1 { animation: glow1 6.8s ease-out infinite both; }
    @keyframes glow1 { 0%, 27.0% { opacity: 0; } 28.0% { opacity: 1; } 37.0%, 100% { opacity: 0; } }
    .g2 { animation: glow2 6.8s ease-out infinite both; }
    @keyframes glow2 { 0%, 55.0% { opacity: 0; } 56.0% { opacity: 1; } 65.0%, 100% { opacity: 0; } }
    .g3 { animation: glow3 6.8s ease-out infinite both; }
    @keyframes glow3 { 0%, 83.0% { opacity: 0; } 84.0% { opacity: 1; } 93.0%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .ev, .g0, .g1, .g2, .g3 { animation: none; }
      .ev { transform: translateX(330px); }
    }
  </style>
  <rect class="panel" x="1" y="1" width="898" height="298" rx="16"/>
  <text class="name" x="48" y="78">README Studio</text>
  <text class="role" x="48" y="110">A Claude skill that designs animated GitHub READMEs</text>
  <text class="code" x="48" y="146">python3 generate.py profile.json out/</text>
  <rect class="cursor" x="392" y="133" width="9" height="17"/>
  <rect class="card" x="620" y="36" width="232" height="124" rx="12"/>
  <text class="k" x="640" y="62">Made by</text>
  <text class="v" x="640" y="86">Saikat Kumar Gain</text>
  <text class="k" x="640" y="106">Backend engineer, Dhaka</text>
  <text class="lnk" x="640" y="140">github.com/SKgain</text>
  <line class="wire" x1="120" y1="224.0" x2="780" y2="224.0"/>
  <circle class="event ev trail" cx="120" cy="224.0" r="4"/>
  <circle class="event ev" cx="120" cy="224.0" r="5.5"/>
  <rect class="node" x="48" y="200" width="144" height="48" rx="10"/>
  <rect class="glow g0" x="48" y="200" width="144" height="48" rx="10"/>
  <text class="label" x="120" y="229" text-anchor="middle">Your facts</text>
  <text class="sub" x="120" y="270" text-anchor="middle">profile.json</text>
  <rect class="node" x="268" y="200" width="144" height="48" rx="10"/>
  <rect class="glow g1" x="268" y="200" width="144" height="48" rx="10"/>
  <text class="label" x="340" y="229" text-anchor="middle">generate</text>
  <text class="sub" x="340" y="270" text-anchor="middle">SVG panels</text>
  <rect class="node" x="488" y="200" width="144" height="48" rx="10"/>
  <rect class="glow g2" x="488" y="200" width="144" height="48" rx="10"/>
  <text class="label" x="560" y="229" text-anchor="middle">preview</text>
  <text class="sub" x="560" y="270" text-anchor="middle">both themes checked</text>
  <rect class="node" x="708" y="200" width="144" height="48" rx="10"/>
  <rect class="glow g3" x="708" y="200" width="144" height="48" rx="10"/>
  <text class="label" x="780" y="229" text-anchor="middle">GitHub</text>
  <text class="sub" x="780" y="270" text-anchor="middle">your README</text>
</svg>
